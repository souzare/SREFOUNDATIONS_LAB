worker_processes 1;
events { worker_connections 512; }

http {
  access_log /dev/stdout;

  # Cada cliente (?customer=N) é fixado em UMA célula via hash consistente.
  # max_fails=0 e proxy_next_upstream off: a célula doente NÃO é removida
  # nem redirecionada -> o raio da explosão fica contido na célula.
  upstream cells {
    hash $arg_customer consistent;
    server cell-a:8000 max_fails=0;
    server cell-b:8000 max_fails=0;
    server cell-c:8000 max_fails=0;
  }

  server {
    listen 80;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_next_upstream off;

    location = /nginx-health { return 200 "ok\n"; }

    # acesso direto a cada célula (útil para demonstrar)
    location /cell-a/ { proxy_pass http://cell-a:8000/; }
    location /cell-b/ { proxy_pass http://cell-b:8000/; }
    location /cell-c/ { proxy_pass http://cell-c:8000/; }

    location / { proxy_pass http://cells; }
  }
}
